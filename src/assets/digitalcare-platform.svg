<svg width="940" height="680" viewBox="0 0 940 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- The Prescription Card -->
  <rect x="20" y="20" width="900" height="640" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Hospital & Dr Info -->
  <text x="80" y="80" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Dr. Ahmed</text>
  <text x="80" y="105" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16">Cardiology</text>
  <text x="80" y="125" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14">License No: LIC-001</text>
  <text x="80" y="145" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14">Phone: 03001234567</text>
  
  <!-- SparkNext Hospital Brand -->
  <path d="M78 185 L 83 172 L 88 185 L 101 190 L 88 195 L 83 208 L 78 195 L 65 190 Z" fill="#06B6D4" />
  <text x="110" y="196" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">SparkNext Hospital</text>

  <!-- Patient Info Block -->
  <rect x="620" y="60" width="240" height="125" rx="12" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
  <text x="640" y="85" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MR NO</text>
  <text x="640" y="100" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="700">MR-0023</text>
  
  <text x="760" y="85" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DATE</text>
  <text x="760" y="100" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="700">31/08/2026</text>
  
  <text x="640" y="125" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">NAME</text>
  <text x="640" y="140" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Asjad</text>
  
  <text x="760" y="125" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AGE</text>
  <text x="760" y="140" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="700">21</text>
  
  <text x="640" y="165" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GENDER</text>
  <text x="640" y="180" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Male</text>
  
  <text x="760" y="165" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PHONE</text>
  <text x="760" y="180" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3314166612</text>
  
  <line x1="80" y1="215" x2="860" y2="215" stroke="#E2E8F0" stroke-width="2"/>

  <!-- RX SECTION -->
  <text x="80" y="255" fill="#0F172A" font-family="Georgia, serif" font-size="32" font-weight="bold">Rx</text>
  <text x="125" y="250" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">MEDICINES</text>

  <text x="80" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SR.</text>
  <text x="125" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MEDICINE</text>
  <text x="380" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DOSAGE</text>
  <line x1="80" y1="285" x2="430" y2="285" stroke="#F1F5F9" stroke-width="2"/>

  <!-- Med 1 -->
  <text x="80" y="310" fill="#334155" font-family="system-ui, sans-serif" font-size="14">1</text>
  <text x="125" y="310" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Aspirin</text>
  <text x="125" y="330" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Once daily after meal</text>
  <text x="380" y="310" fill="#334155" font-family="system-ui, sans-serif" font-size="14">75mg</text>
  <line x1="80" y1="345" x2="430" y2="345" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Med 2 -->
  <text x="80" y="370" fill="#334155" font-family="system-ui, sans-serif" font-size="14">2</text>
  <text x="125" y="370" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Ramipril</text>
  <text x="125" y="390" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Once daily</text>
  <text x="380" y="370" fill="#334155" font-family="system-ui, sans-serif" font-size="14">5mg</text>
  <line x1="80" y1="405" x2="430" y2="405" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Med 3 -->
  <text x="80" y="430" fill="#334155" font-family="system-ui, sans-serif" font-size="14">3</text>
  <text x="125" y="430" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Atorvastatin</text>
  <text x="125" y="450" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Once daily at night</text>
  <text x="380" y="430" fill="#334155" font-family="system-ui, sans-serif" font-size="14">40mg</text>
  <line x1="80" y1="465" x2="430" y2="465" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Med 4 -->
  <text x="80" y="490" fill="#334155" font-family="system-ui, sans-serif" font-size="14">4</text>
  <text x="125" y="490" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Metoprolol</text>
  <text x="125" y="510" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Twice daily</text>
  <text x="380" y="490" fill="#334155" font-family="system-ui, sans-serif" font-size="14">50mg</text>
  <line x1="80" y1="525" x2="430" y2="525" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Med 5 -->
  <text x="80" y="550" fill="#334155" font-family="system-ui, sans-serif" font-size="14">5</text>
  <text x="125" y="550" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Clopidogrel</text>
  <text x="125" y="570" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Once daily</text>
  <text x="380" y="550" fill="#334155" font-family="system-ui, sans-serif" font-size="14">75mg</text>

  <!-- Vertical Divider -->
  <line x1="470" y1="230" x2="470" y2="560" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />

  <!-- CLINICAL NOTES SECTION -->
  <text x="510" y="245" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">CLINICAL NOTES</text>
  
  <text x="510" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CHIEF COMPLAINT</text>
  <text x="510" y="295" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14">Heart Patient</text>
  <line x1="510" y1="310" x2="860" y2="310" stroke="#F8FAFC" stroke-width="2"/>

  <text x="510" y="335" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DIAGNOSIS</text>
  <text x="510" y="355" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14">Stone in Kidney</text>
  <line x1="510" y1="370" x2="860" y2="370" stroke="#F8FAFC" stroke-width="2"/>

  <text x="510" y="395" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">NOTES</text>
  <text x="510" y="415" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14">-</text>

  <!-- Footer -->
  <line x1="80" y1="590" x2="860" y2="590" stroke="#E2E8F0" stroke-width="2"/>
  
  <text x="80" y="615" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">This prescription is generated from the clinic record. Please follow the</text>
  <text x="80" y="630" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">doctor's advice and contact the clinic if clarification is needed.</text>

  <text x="760" y="615" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Dr. Ahmed</text>
  <text x="760" y="630" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Doctor Signature</text>
  <line x1="690" y1="590" x2="830" y2="590" stroke="#0F172A" stroke-width="2"/>

</svg>
