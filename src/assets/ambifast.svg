<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <filter id="toast-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Dashboard Background -->
  <rect width="1200" height="620" fill="#f4f6f9"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="80" height="620" fill="#2d3748"/>
  <rect x="20" y="20" width="40" height="40" rx="8" fill="#e2e8f0" fill-opacity="0.1"/>
  <!-- Sidebar Icons -->
  <circle cx="40" cy="100" r="10" fill="#a0aec0"/>
  <rect x="30" y="140" width="20" height="15" rx="3" fill="#a0aec0"/>
  <rect x="30" y="190" width="20" height="20" rx="10" fill="#a0aec0"/>
  <path d="M40 240 L30 255 L50 255 Z" fill="#a0aec0"/>
  <rect x="30" y="290" width="20" height="20" fill="#a0aec0"/>
  <rect x="30" y="340" width="20" height="5" fill="#a0aec0"/>
  <rect x="30" y="350" width="20" height="5" fill="#a0aec0"/>
  
  <!-- Topbar -->
  <rect x="80" y="0" width="1120" height="60" fill="#ffffff" filter="url(#shadow)"/>
  <text x="110" y="38" fill="#1a202c" font-family="system-ui, sans-serif" font-size="24" font-weight="700">AmbiFast</text>
  <rect x="240" y="24" width="20" height="3" fill="#a0aec0"/>
  <rect x="240" y="32" width="20" height="3" fill="#a0aec0"/>
  <rect x="240" y="40" width="20" height="3" fill="#a0aec0"/>

  <!-- Toast Notification -->
  <rect x="900" y="10" width="280" height="40" rx="4" fill="#48bb78" filter="url(#toast-shadow)"/>
  <path d="M920 30 L930 40 L950 15" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="970" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Login successful</text>

  <!-- Page Header -->
  <text x="120" y="100" fill="#2d3748" font-family="system-ui, sans-serif" font-size="26" font-weight="600">Dashboard</text>
  <text x="1120" y="95" fill="#718096" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="end">Home / Dashboard</text>

  <!-- Cards -->
  <!-- Card 1 -->
  <rect x="120" y="125" width="240" height="110" rx="6" fill="#001f3f" filter="url(#shadow)"/>
  <text x="140" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">1,240</text>
  <text x="140" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Total Customers</text>
  <circle cx="310" cy="180" r="35" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Card 2 -->
  <rect x="385" y="125" width="240" height="110" rx="6" fill="#28a745" filter="url(#shadow)"/>
  <text x="405" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">3,500</text>
  <text x="405" y="210" fill="#c6f6d5" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Total Bookings</text>
  <rect x="560" y="165" width="35" height="35" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Card 3 -->
  <rect x="650" y="125" width="240" height="110" rx="6" fill="#e83e8c" filter="url(#shadow)"/>
  <text x="670" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">3,210</text>
  <text x="670" y="210" fill="#fed7e2" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Completed Bookings</text>
  <path d="M830 155 L865 155 L865 210 L847.5 195 L830 210 Z" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Card 4 (Libyan Currency) -->
  <rect x="915" y="125" width="245" height="110" rx="6" fill="#6f42c1" filter="url(#shadow)"/>
  <text x="935" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">45,000 LYD</text>
  <text x="935" y="210" fill="#e9d8fd" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Total Earnings</text>
  <circle cx="1110" cy="180" r="25" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5"/>

  <!-- Charts Section -->
  <!-- Left Chart (Bar Chart) -->
  <rect x="120" y="260" width="505" height="320" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text x="372" y="290" fill="#4a5568" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle"># of Bookings</text>
  <rect x="300" y="282" width="14" height="10" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  
  <!-- Grid Lines -->
  <line x1="160" y1="320" x2="580" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="370" x2="580" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="420" x2="580" y2="420" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="470" x2="580" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="520" x2="580" y2="520" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="160" y1="540" x2="580" y2="540" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Bars -->
  <rect x="180" y="440" width="25" height="100" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="220" y="320" width="25" height="220" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="260" y="370" width="25" height="170" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="300" y="380" width="25" height="160" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="340" y="420" width="25" height="120" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="380" y="400" width="25" height="140" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="420" y="430" width="25" height="110" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="460" y="460" width="25" height="80" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <rect x="500" y="510" width="25" height="30" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>

  <!-- X-Axis Labels -->
  <text x="192" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Jan</text>
  <text x="232" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Feb</text>
  <text x="272" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mar</text>
  <text x="312" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Apr</text>
  <text x="352" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">May</text>
  <text x="392" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Jun</text>
  <text x="432" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Jul</text>
  <text x="472" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Aug</text>
  <text x="512" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sep</text>

  <!-- Right Chart (Area Chart) -->
  <rect x="655" y="260" width="505" height="320" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text x="907" y="290" fill="#4a5568" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle"># of Customers</text>
  <rect x="835" y="282" width="14" height="10" fill="#d6bcfa" stroke="#8b5cf6" stroke-width="1"/>

  <!-- Grid Lines -->
  <line x1="695" y1="320" x2="1115" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="695" y1="370" x2="1115" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="695" y1="420" x2="1115" y2="420" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="695" y1="470" x2="1115" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="695" y1="520" x2="1115" y2="520" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="695" y1="540" x2="1115" y2="540" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Area Path -->
  <path d="M 727 410 Q 750 380 767 390 T 807 470 T 847 450 T 887 480 T 927 485 T 967 490 T 1007 500 T 1047 470 T 1087 310 L 1087 540 L 727 540 Z" fill="url(#area-grad)"/>
  <path d="M 727 410 Q 750 380 767 390 T 807 470 T 847 450 T 887 480 T 927 485 T 967 490 T 1007 500 T 1047 470 T 1087 310" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- Data Points -->
  <circle cx="727" cy="410" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="767" cy="390" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="807" cy="470" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="847" cy="450" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="887" cy="480" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="927" cy="485" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="967" cy="490" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="1007" cy="500" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="1047" cy="470" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="1087" cy="310" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>

  <!-- X-Axis Labels -->
  <text x="727" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Jan</text>
  <text x="767" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Feb</text>
  <text x="807" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mar</text>
  <text x="847" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Apr</text>
  <text x="887" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">May</text>
  <text x="927" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Jun</text>
  <text x="967" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Jul</text>
  <text x="1007" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Aug</text>
  <text x="1047" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sep</text>
  <text x="1087" y="565" fill="#718096" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Oct</text>
</svg>
